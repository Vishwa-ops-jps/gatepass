databases:
  - name: gatepass-db
    databaseName: gatepass
    user: gatepass_user
    plan: free

services:
  - type: web
    name: gatepass
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: gatepass-db
          property: connectionString
